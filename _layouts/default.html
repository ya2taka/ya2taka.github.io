<!doctype html>
<html lang="{{ page.lang | default: site.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
<style>
  :root { --bg: #f6f8f8; --text: #1b2526; --sub: #5b6b6d; --line: #d9e2e3; --accent: #0f8a8a; --card: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b1416; --text: #e6efef; --sub: #93a6a8; --line: #22373a; --accent: #3fd0c9; --card: #102023; }
  }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.75 -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  a { color: var(--accent); }
  h1 { font-size: 1.7rem; line-height: 1.3; }
  h2 { font-size: 1.2rem; margin-top: 2.2em; padding-bottom: .3em; border-bottom: 1px solid var(--line); }
  table { width: 100%; border-collapse: collapse; font-size: .92rem; display: block; overflow-x: auto; }
  th, td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
  th { background: var(--card); }
  .lang { text-align: right; font-size: .9rem; }
  .app { display: flex; gap: 16px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; text-decoration: none; color: inherit; }
  .app img { width: 64px; height: 64px; border-radius: 14px; }
  footer { margin-top: 48px; color: var(--sub); font-size: .85rem; }
</style>
</head>
<body>
<main>
{% if page.alt %}<p class="lang"><a href="{{ page.alt }}">{{ page.altlabel }}</a></p>{% endif %}
{{ content }}
<footer>© 2026 ya2taka</footer>
</main>
</body>
</html>
